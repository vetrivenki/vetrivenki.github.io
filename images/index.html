<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Technical Image Gallery | Venkat’s Tech Lab</title><meta name="description" content="Browse AWS, Kubernetes, AI, Python, Terraform and certification visual guides by Venkatesan Vetrimurasu."><link rel="icon" href="../favicon.svg">
<style>
:root{color-scheme:light;--ink:#12243a;--blue:#185adb;--muted:#607087;--line:#dce3ec}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--ink);font:16px/1.5 system-ui,sans-serif}a{color:var(--blue)}header{background:#10263f;color:white;padding:44px max(24px,calc((100vw - 1240px)/2))}header a{color:#b9d7ff}header h1{font-size:clamp(30px,5vw,48px);margin:16px 0 8px}header p{max-width:760px;color:#c7d5e5;margin:6px 0}main{max-width:1288px;margin:auto;padding:28px 24px}label{font-weight:650}input,select,button{font:inherit}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;margin:8px 0 16px;background:white}button,.action{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:8px 12px;text-decoration:none}button:hover,.action:hover{border-color:var(--blue);color:var(--blue)}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #e99925;outline-offset:3px}#categories{display:flex;flex-wrap:wrap;gap:8px}#categories button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:white}.toolbar{display:flex;gap:20px;align-items:center;justify-content:space-between;margin:24px 0}select{padding:8px;border:1px solid var(--line);border-radius:8px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:20px}.card{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.preview{display:block;background:#eaf0f7;height:260px;padding:12px}.preview img{width:100%;height:100%;object-fit:contain}.details{padding:18px;display:flex;flex-direction:column;flex:1}.details h2{font-size:17px;line-height:1.4;margin:0 0 10px;overflow-wrap:anywhere}.tags{font-size:12px;color:var(--muted);margin:0 0 16px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;font-size:14px}.pager{display:flex;justify-content:center;align-items:center;gap:18px;margin:30px 0}button:disabled{opacity:.45;cursor:default}footer{padding:30px;text-align:center;color:var(--muted);border-top:1px solid var(--line)}#status{color:var(--muted)}@media(max-width:550px){.toolbar{align-items:flex-start;flex-direction:column}header{padding:28px 24px}}
</style></head>
<body><header><a href="../">← Professional portfolio</a><h1>Technical visual library</h1><p>AWS, Kubernetes, AI and cloud engineering — explore a topic, study a guide, or download the original image.</p><p>Created by Venkatesan Vetrimurasu · Venkat’s Tech Lab</p></header>
<main><label for="search">Find an image</label><input id="search" type="search" placeholder="Search topics, services, certifications…" autocomplete="off"><nav id="categories" aria-label="Image categories"></nav><div class="toolbar"><span id="status" role="status" aria-live="polite">Loading images…</span><label>Sort <select id="sort"><option value="title">Title / series order</option><option value="reverse">Title Z–A</option></select></label></div><section id="grid" aria-label="Technical images"></section><div class="pager"><button id="previous">← Previous</button><span id="page"></span><button id="next">Next →</button></div></main><footer>Venkat’s Tech Lab · <a href="../ebook/">Technical ebook</a> · <a href="catalog.json">Image catalog</a></footer>
<script>
const categories={'all':'All images','aws':'AWS Cloud','aws-decisions':'AWS Decisions 01–40','aws-ha-dr':'AWS HA & DR','kubernetes':'Kubernetes & EKS','certifications':'Certifications','ai':'AI & Agents','python-ai':'Python for AI','terraform':'Terraform & IaC','devops':'DevOps, Git & Linux','architecture':'System Design & Architecture','branding':'Technical Covers & Branding'};
const params=new URLSearchParams(location.search);let active=params.get('category')||'all';if(!categories[active])active='all';let page=1,items=[],size=24;
const search=document.querySelector('#search'),grid=document.querySelector('#grid'),status=document.querySelector('#status'),sort=document.querySelector('#sort');
search.value=params.get('q')||'';
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}
function url(){const p=new URLSearchParams();if(active!=='all')p.set('category',active);if(search.value.trim())p.set('q',search.value.trim());history.replaceState(null,'',location.pathname+(p.size?'?'+p:''));
}
function drawCategories(){const nav=document.querySelector('#categories');nav.replaceChildren();for(const [id,label]of Object.entries(categories)){const count=id==='all'?items.length:items.filter(i=>i.categories.includes(id)).length;const b=node('button',label+' ('+count+')');b.setAttribute('aria-pressed',String(id===active));b.onclick=()=>{active=id;page=1;url();drawCategories();render()};nav.append(b)}}
function render(){const q=search.value.toLowerCase().trim();let filtered=items.filter(i=>(active==='all'||i.categories.includes(active))&&(!q||(i.title+' '+i.categories.map(c=>categories[c]).join(' ')).toLowerCase().includes(q)));if(sort.value==='reverse')filtered.reverse();const total=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,total);grid.replaceChildren();
for(const item of filtered.slice((page-1)*size,page*size)){const card=node('article',undefined,'card');const preview=node('a',undefined,'preview');preview.href=item.original;preview.target='_blank';preview.rel='noopener';preview.setAttribute('aria-label','Open '+item.title+' at full size');const img=node('img');img.src=item.thumbnail;img.alt=item.title;img.loading='lazy';img.decoding='async';preview.append(img);const detail=node('div',undefined,'details');detail.append(node('h2',item.title),node('p',item.categories.map(c=>categories[c]).join(' · '),'tags'));const actions=node('div',undefined,'actions');const open=node('a','Open original','action');open.href=item.original;open.target='_blank';open.rel='noopener';const download=node('a','Download','action');download.href=item.original;download.download=item.filename;const copy=node('button','Copy link');copy.onclick=async()=>{try{await navigator.clipboard.writeText(new URL(item.original,location.href).href);copy.textContent='Copied';setTimeout(()=>copy.textContent='Copy link',1500)}catch{copy.textContent='Open original to copy URL'}};actions.append(open,download,copy);detail.append(actions);card.append(preview,detail);grid.append(card)}
status.textContent=filtered.length+' image'+(filtered.length===1?'':'s')+' · '+categories[active];if(!filtered.length)grid.append(node('p','No images match. Try another search or category.'));document.querySelector('#page').textContent='Page '+page+' of '+total;document.querySelector('#previous').disabled=page===1;document.querySelector('#next').disabled=page===total;
}
search.oninput=()=>{page=1;url();render()};sort.onchange=()=>{page=1;render()};for(const [id,step]of [['previous',-1],['next',1]])document.querySelector('#'+id).onclick=()=>{page+=step;render();document.querySelector('#categories').scrollIntoView({behavior:'smooth'})};
fetch('catalog.json').then(r=>{if(!r.ok)throw Error('Catalog unavailable');return r.json()}).then(data=>{items=data;drawCategories();render()}).catch(()=>{status.textContent='The image catalog could not load. Please refresh the page.'});
</script></body></html>
