<title>Venkatesan Vetrimurasu · Venkat's Tech Lab - Study Guides &amp; Ebooks</title>
<style>
  :root{--navy:#0b1630;--navy2:#13244a;--card:#16294f;--orange:#f39a2e;--orange2:#ffb45c;--text:#eef2fa;--muted:#a9b6d3;--line:rgba(255,255,255,.10)}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);
       background:radial-gradient(1200px 600px at 80% -10%,#1f3a72 0%,transparent 60%),linear-gradient(180deg,var(--navy) 0%,#0e1d3d 100%);min-height:100vh}
  a{color:inherit}
  header{padding:56px 20px 36px;text-align:center;border-bottom:1px solid var(--line);position:relative}
  header::after{content:"";display:block;width:90px;height:4px;background:var(--orange);margin:22px auto 0;border-radius:2px}
  .eyebrow{letter-spacing:.32em;font-size:12px;font-weight:700;color:var(--orange);text-transform:uppercase;margin:0 0 14px}
  h1{font-size:clamp(34px,6vw,64px);line-height:1.05;margin:0;font-weight:800;letter-spacing:-.01em}
  .subtitle{font-size:clamp(16px,2.4vw,22px);color:var(--muted);margin:14px 0 22px}
  .yt{display:inline-flex;align-items:center;gap:10px;background:var(--orange);color:#1a1205;text-decoration:none;font-weight:700;padding:11px 20px;border-radius:999px;transition:transform .15s,background .15s}
  .yt:hover{background:var(--orange2);transform:translateY(-1px)}
  .yt svg{width:22px;height:22px}
  main{max-width:1200px;margin:0 auto;padding:40px 20px 60px}
  .section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 22px}
  .section-title h2{margin:0;font-size:24px}
  .section-title span{color:var(--muted);font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px}
  .card{background:linear-gradient(180deg,var(--card),var(--navy2));border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .2s,border-color .2s}
  .card:hover{transform:translateY(-4px);border-color:rgba(243,154,46,.55)}
  .cover{position:relative;aspect-ratio:600/849;background:#0b1630;overflow:hidden;display:block}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover .name-overlay{position:absolute;left:0;right:0;bottom:0;padding:16px 18px;background:linear-gradient(0deg,rgba(11,22,48,.95),rgba(11,22,48,0));font-weight:800;font-size:20px}
  .cover .name-overlay small{display:block;font-size:11px;letter-spacing:.2em;color:var(--orange);font-weight:700;margin-bottom:4px}
  .cover .placeholder{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;color:var(--muted)}
  .badge{position:absolute;top:12px;right:12px;background:var(--orange);color:#1a1205;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .body{padding:20px 20px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
  .body h3{margin:0;font-size:19px;line-height:1.25}
  .body p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5}
  .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px}
  .meta span{border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:#d5def0}
  .meta span.hl{border-color:rgba(243,154,46,.6);color:var(--orange2)}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
  .btn{flex:1 1 auto;text-align:center;text-decoration:none;font-weight:700;font-size:14px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--orange);color:var(--orange2);transition:background .15s,color .15s}
  .btn.primary{background:var(--orange);color:#1a1205}
  .btn:hover{background:var(--orange2);color:#1a1205;border-color:var(--orange2)}
  .btn.disabled{opacity:.45;pointer-events:none}
  footer{border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:13.5px;padding:26px 20px 40px}
  footer a{color:var(--orange2)}
  @media (max-width:520px){header{padding:40px 16px 28px}main{padding:28px 14px 40px}.grid{grid-template-columns:1fr;gap:22px}}
</style>
